<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const SUPA_URL = 'https://xnwwksxbjguncejbfsom.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhud3drc3hiamd1bmNlamJmc29tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxODY5MDgsImV4cCI6MjEwNTc2MjkwOH0.UiW56S_uRibVsKjysG3NOTKCjvGzOZofpeoa4H38M9I';
let entries = JSON.parse(localStorage.getItem('gc_entries') || '[]');
let profile = JSON.parse(localStorage.getItem('gc_profile') || '{}');
let selectedCategory = 'clinical';

function incrementStat(key, amount) {
  fetch(SUPA_URL + '/rest/v1/rpc/increment_stat', {
    method: 'POST',
    headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ stat_key: key, increment_by: amount })
  }).catch(function() {});
}

function init() {
  if (profile.name) document.getElementById('volunteerName').value = profile.name;
  if (profile.org) document.getElementById('volunteerOrg').value = profile.org;
  document.getElementById('visitDate').value = new Date().toISOString().split('T')[0];
  renderEntries();
  updateStats();
}

function setCategory(cat) {
  selectedCategory = cat;
  document.getElementById('btnClinical').className = 'cat-btn' + (cat === 'clinical' ? ' active-clinical' : '');
  document.getElementById('btnNonclinical').className = 'cat-btn' + (cat === 'nonclinical' ? ' active-nonclinical' : '');
}

function saveProfile() {
  const isNew = !profile.name;
  profile.name = document.getElementById('volunteerName').value.trim();
  profile.org = document.getElementById('volunteerOrg').value.trim();
  if (!profile.name) { showToast('Please enter your name.'); return; }
  localStorage.setItem('gc_profile', JSON.stringify(profile));
  if (isNew || !localStorage.getItem('gc_counted')) {
    incrementStat('volunteers', 1);
    localStorage.setItem('gc_counted', '1');
  }
  showToast('Profile saved!');
}

function logVisit() {
  const facility = document.getElementById('facilityName').value.trim();
  const date = document.getElementById('visitDate').value;
  const hours = parseFloat(document.getElementById('visitHours').value);
  const type = document.getElementById('facilityType').value;
  const activity = document.getElementById('visitActivity').value.trim();
  const notes = document.getElementById('visitNotes').value.trim();
  const supervisorName = document.getElementById('supervisorName').value.trim();
  const supervisorContact = document.getElementById('supervisorContact').value.trim();
  const category = selectedCategory;

  if (!facility) { showToast('Please enter a facility name.'); return; }
  if (!date) { showToast('Please select a date.'); return; }
  if (!hours || hours <= 0) { showToast('Please enter valid hours.'); return; }

  const entry = { id: Date.now(), facility, date, hours, type, activity, notes, supervisorName, supervisorContact, category };
  entries.unshift(entry);
  localStorage.setItem('gc_entries', JSON.stringify(entries));
  incrementStat('hours', hours);
  renderEntries();
  updateStats();
  clearForm();
  showToast('Visit logged!');
}

function deleteEntry(id) {
  entries = entries.filter(function(e) { return e.id !== id; });
  localStorage.setItem('gc_entries', JSON.stringify(entries));
  renderEntries();
  updateStats();
  showToast('Entry removed.');
}

function clearForm() {
  document.getElementById('facilityName').value = '';
  document.getElementById('visitHours').value = '';
  document.getElementById('facilityType').value = '';
  document.getElementById('visitActivity').value = '';
  document.getElementById('visitNotes').value = '';
  document.getElementById('supervisorName').value = '';
  document.getElementById('supervisorContact').value = '';
  document.getElementById('visitDate').value = new Date().toISOString().split('T')[0];
  setCategory('clinical');
}

function renderEntries() {
  const list = document.getElementById('entriesList');
  if (entries.length === 0) {
    list.innerHTML = '<div class="empty-entries"><i class="ti ti-clipboard-list"></i><p>No visits logged yet. Add your first one above.</p></div>';
    return;
  }
  const clinical = entries.filter(function(e) { return e.category === 'clinical'; });
  const nonclinical = entries.filter(function(e) { return e.category !== 'clinical'; });

  function renderCard(e) {
    const dateStr = new Date(e.date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    const catClass = e.category === 'clinical' ? 'clinical' : 'nonclinical';
    const catLabel = e.category === 'clinical' ? 'Clinical' : 'Non-Clinical';
    return '<div class="entry-card">' +
      '<div class="entry-left">' +
        '<div class="entry-facility">' + e.facility + '</div>' +
        '<div class="entry-meta">' +
          '<span><i class="ti ti-calendar" style="font-size:13px"></i> ' + dateStr + '</span>' +
          (e.type ? '<span><i class="ti ti-building" style="font-size:13px"></i> ' + e.type + '</span>' : '') +
          (e.activity ? '<span><i class="ti ti-activity" style="font-size:13px"></i> ' + e.activity + '</span>' : '') +
        '</div>' +
        (e.supervisorName ? '<div class="entry-supervisor"><i class="ti ti-user" style="font-size:12px"></i> ' + e.supervisorName + (e.supervisorContact ? ' · ' + e.supervisorContact : '') + '</div>' : '') +
        (e.notes ? '<div class="entry-notes">"' + e.notes + '"</div>' : '') +
      '</div>' +
      '<div class="entry-right">' +
        '<div class="entry-hours">' + e.hours + 'h</div>' +
        '<span class="cat-tag ' + catClass + '">' + catLabel + '</span>' +
        '<button class="btn-delete" onclick="deleteEntry(' + e.id + ')"><i class="ti ti-trash"></i></button>' +
      '</div>' +
    '</div>';
  }

  let html = '';
  if (clinical.length > 0) {
    html += '<div class="section-divider">Clinical / Patient-Facing</div>';
    html += clinical.map(renderCard).join('');
  }
  if (nonclinical.length > 0) {
    html += '<div class="section-divider">Community / Non-Clinical</div>';
    html += nonclinical.map(renderCard).join('');
  }
  list.innerHTML = html;
}

function updateStats() {
  const totalHours = entries.reduce(function(sum, e) { return sum + e.hours; }, 0);
  const clinHours = entries.filter(function(e) { return e.category === 'clinical'; }).reduce(function(sum, e) { return sum + e.hours; }, 0);
  const facilities = new Set(entries.map(function(e) { return e.facility; }));
  document.getElementById('totalHours').textContent = totalHours % 1 === 0 ? totalHours : totalHours.toFixed(1);
  document.getElementById('clinicalHours').textContent = clinHours % 1 === 0 ? clinHours : clinHours.toFixed(1);
  document.getElementById('totalVisits').textContent = entries.length;
  document.getElementById('totalFacilities').textContent = facilities.size;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function downloadPDF() {
  if (entries.length === 0) { showToast('No entries to download yet.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const name = profile.name || 'Volunteer';
  const org = profile.org || '';
  const totalHours = entries.reduce(function(sum, e) { return sum + e.hours; }, 0);
  const clinHours = entries.filter(function(e) { return e.category === 'clinical'; }).reduce(function(sum, e) { return sum + e.hours; }, 0);
  const facilities = new Set(entries.map(function(e) { return e.facility; }));
  const today = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  doc.setFillColor(15, 42, 74);
  doc.rect(0, 0, 210, 40, 'F');
  doc.setTextColor(201, 168, 76);
  doc.setFontSize(18);
  doc.setFont('helvetica', 'bold');
  doc.text('GenerationConnect', 15, 16);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(168, 189, 212);
  doc.text('Volunteer Hours Summary — Application Ready', 15, 24);
  doc.text('generation-connect.vercel.app', 15, 31);
  doc.setTextColor(15, 42, 74);
  doc.setFontSize(14);
  doc.setFont('helvetica', 'bold');
  doc.text(name, 15, 54);
  doc.setFontSize(10);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(100, 100, 100);
  if (org) doc.text(org, 15, 61);
  doc.text('Generated: ' + today, 15, org ? 68 : 61);
  const boxY = org ? 76 : 70;
  const boxes = [
    { label: 'Total Hours', value: totalHours % 1 === 0 ? totalHours : totalHours.toFixed(1) },
    { label: 'Clinical Hours', value: clinHours % 1 === 0 ? clinHours : clinHours.toFixed(1) },
    { label: 'Visits', value: entries.length },
    { label: 'Facilities', value: facilities.size }
  ];
  boxes.forEach(function(b, i) {
    const x = 15 + i * 45;
    doc.setFillColor(245, 240, 232);
    doc.roundedRect(x, boxY, 40, 22, 3, 3, 'F');
    doc.setTextColor(201, 168, 76);
    doc.setFontSize(14);
    doc.setFont('helvetica', 'bold');
    doc.text(String(b.value), x + 20, boxY + 12, { align: 'center' });
    doc.setTextColor(120, 120, 120);
    doc.setFontSize(7);
    doc.setFont('helvetica', 'normal');
    doc.text(b.label, x + 20, boxY + 19, { align: 'center' });
  });
  const tableY = boxY + 30;
  doc.setFillColor(15, 42, 74);
  doc.rect(15, tableY, 180, 9, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFontSize(7.5);
  doc.setFont('helvetica', 'bold');
  doc.text('Date', 17, tableY + 6);
  doc.text('Facility', 45, tableY + 6);
  doc.text('Type', 100, tableY + 6);
  doc.text('Category', 130, tableY + 6);
  doc.text('Supervisor', 158, tableY + 6);
  doc.text('Hrs', 191, tableY + 6);
  let y = tableY + 9;
  const sorted = entries.slice().sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
  sorted.forEach(function(e, i) {
    if (y > 265) { doc.addPage(); y = 20; }
    const rowH = e.supervisorName ? 12 : 9;
    if (i % 2 === 0) { doc.setFillColor(250, 248, 244); doc.rect(15, y, 180, rowH, 'F'); }
    doc.setTextColor(60, 60, 60);
    doc.setFontSize(7.5);
    doc.setFont('helvetica', 'normal');
    const dateStr = new Date(e.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: '2-digit' });
    doc.text(dateStr, 17, y + 6);
    doc.text(e.facility.length > 22 ? e.facility.substring(0, 22) + '...' : e.facility, 45, y + 6);
    doc.text(e.type || '', 100, y + 6);
    doc.text(e.category === 'clinical' ? 'Clinical' : 'Non-Clinical', 130, y + 6);
    if (e.supervisorName) {
      doc.text(e.supervisorName.length > 14 ? e.supervisorName.substring(0, 14) + '...' : e.supervisorName, 158, y + 5);
      if (e.supervisorContact) {
        doc.setFontSize(6.5);
        doc.setTextColor(120, 120, 120);
        doc.text(e.supervisorContact.length > 18 ? e.supervisorContact.substring(0, 18) + '...' : e.supervisorContact, 158, y + 10);
        doc.setFontSize(7.5);
        doc.setTextColor(60, 60, 60);
      }
    }
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(201, 168, 76);
    doc.text(e.hours + 'h', 192, y + 6);
    y += rowH;
  });
  y += 8;
  if (y > 260) { doc.addPage(); y = 20; }
  doc.setDrawColor(200, 200, 200);
  doc.line(15, y, 195, y);
  y += 7;
  doc.setTextColor(120, 120, 120);
  doc.setFontSize(8);
  doc.setFont('helvetica', 'normal');
  doc.text('This document was generated by the volunteer and is intended for application purposes. Verifying contacts are listed above.', 15, y);
  doc.setFillColor(15, 42, 74);
  doc.rect(0, 285, 210, 12, 'F');
  doc.setTextColor(90, 122, 154);
  doc.setFontSize(7);
  doc.text('GenerationConnect  |  generation-connect.vercel.app  |  Connecting volunteers with elder care facilities', 105, 292, { align: 'center' });
  const filename = (name.replace(/\s+/g, '_') || 'Volunteer') + '_GenerationConnect_Hours.pdf';
  doc.save(filename);
}

document.addEventListener('DOMContentLoaded', function() { init(); });
</script>
